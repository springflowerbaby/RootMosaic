{% extends "merchant/base.html" %}
{% block title %}Account Settings{% endblock %}
{% block header_title %}Account Settings{% endblock %}
{% block content %}
<h1 class="page-title">Account Settings</h1>
<div class="card">
    <h3 style="margin-bottom:.8rem;">Basic Information</h3>
    <form method="POST">
        <input type="hidden" name="action" value="profile">
        <div class="form-group">
            <label>Merchant Name</label>
            <input name="username" value="{{ current_user.username or '' }}">
        </div>
        <div class="form-group">
            <label>Phone</label>
            <input name="phone" value="{{ current_user.phone or '' }}">
        </div>
        <button class="btn btn-primary" type="submit">Update Profile</button>
    </form>
</div>
<div class="card">
    <h3 style="margin-bottom:.8rem;">Change Password</h3>
    <form method="POST">
        <input type="hidden" name="action" value="password">
        <div class="form-group">
            <label>Current Password</label>
            <input type="password" name="old_password" required>
        </div>
        <div class="form-group">
            <label>New Password (at least 8 characters)</label>
            <input type="password" name="new_password" required>
        </div>
        <div class="form-group">
            <label>Confirm New Password</label>
            <input type="password" name="confirm_password" required>
        </div>
        <button class="btn btn-primary" type="submit">Update Password</button>
    </form>
</div>
{% endblock %}
