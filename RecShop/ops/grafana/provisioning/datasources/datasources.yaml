apiVersion: 1

# 自动配置 3 个数据源，免手点（Grafana provisioning）
datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Jaeger
    type: jaeger
    uid: jaeger
    access: proxy
    url: http://jaeger:16686

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # log → trace 互跳：从 OTLP log 的结构化元数据 trace_id 链到 Jaeger
      derivedFields:
        - name: TraceID
          matcherType: label          # OTLP log 把 trace_id 作为结构化元数据/label
          matcherRegex: trace_id
          datasourceUid: jaeger
          url: '$${__value.raw}'
