# Collection metrics receiver. Trace/log endpoints and their existing Collector stay unchanged.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    send_timestamps: true
    resource_to_telemetry_conversion:
      enabled: true
service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [prometheus]
# No batch processor: the legacy 5 s metrics batch timeout must not mask 2 s export.
# send_timestamps is supported by the pinned Collector contrib v0.128.0 exporter.
