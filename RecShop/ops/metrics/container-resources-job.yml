# Template: replace node, namespace and proxy origin with the collection environment configuration.
scrape_configs:
  - job_name: cri-resource
    scheme: http
    scrape_interval: 2s
    scrape_timeout: 2s
    honor_timestamps: true
    metrics_path: /api/v1/namespaces/recshop-example/services/m1-cri-resource-exporter:9738/proxy/metrics
    static_configs:
      - targets: ['host.docker.internal:8001']
