# Template: replace node, namespace and proxy origin with the collection environment configuration.
global:
  scrape_interval: 2s
  scrape_timeout: 2s
scrape_configs:
  - job_name: otel-collector
    scrape_interval: 2s
    honor_timestamps: true
    static_configs:
      - targets: ['m1-otel-metrics:8889']
  - job_name: cadvisor
    scheme: http
    scrape_interval: 2s
    honor_timestamps: true
    metrics_path: /api/v1/nodes/replace-with-node-name/proxy/metrics/cadvisor
    static_configs:
      - targets: ['host.docker.internal:8001']
  - job_name: kube-state-metrics
    scheme: http
    scrape_interval: 2s
    honor_timestamps: true
    metrics_path: /api/v1/namespaces/recshop-example/services/kube-state-metrics:8080/proxy/metrics
    static_configs:
      - targets: ['host.docker.internal:8001']
