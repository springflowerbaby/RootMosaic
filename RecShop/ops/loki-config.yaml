# Loki 单机 monolithic 配置，使用 filesystem 存储
# 关键：开 OTLP 原生摄取所需的结构化元数据（trace_id 等）
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # OTLP 摄取依赖结构化元数据（trace_id/span_id 作为 structured metadata）
  allow_structured_metadata: true
  # 日志时间戳接收策略：不按样本年龄拒收旧日志
  reject_old_samples: false
  retention_period: 168h

ruler:
  alertmanager_url: http://localhost:9093

analytics:
  reporting_enabled: false
