# Source template: configure namespace, images, database, assets and observability before use.
# The portable business deployment entry renders the 25 application templates.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-web
  namespace: recshop-example
  labels:
    app: shop_web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shop_web
  template:
    metadata:
      labels:
        app: shop_web
    spec:
      enableServiceLinks: false
      containers:
      - name: shop-web
        image: recweb-shop-web:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3000
        env:
        - name: NACOS_ENABLED
          value: 'false'
        - name: DB_HOST
          value: mysql.example.internal
        - name: DB_PORT
          value: '3306'
        - name: DB_NAME
          value: shopify2
        - name: DB_USER
          value: recshop
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-cred
              key: password
        - name: BACKEND_API_URL
          value: http://backend:5000
        - name: RERANK_SERVICE_URL
          value: http://llm-rerank:5002
        - name: CATALOG_SERVICE_URL
          value: http://catalog:5005
        - name: SEARCH_SERVICE_URL
          value: http://search:5017
        - name: REVIEW_SERVICE_URL
          value: http://review:5003
        - name: REVIEW_QUERY_SERVICE_URL
          value: http://review-query:5018
        - name: ANNOUNCEMENT_SERVICE_URL
          value: http://announcement:5009
        - name: MERCHANT_SERVICE_URL
          value: http://merchant:5019
        - name: USER_SERVICE_URL
          value: http://user:5004
        - name: ADDRESS_SERVICE_URL
          value: http://address:5007
        - name: AI_MEMORY_SERVICE_URL
          value: http://ai-memory:5008
        - name: CART_SERVICE_URL
          value: http://cart:5006
        - name: ORDER_SERVICE_URL
          value: http://order:5010
        - name: CHECKOUT_SERVICE_URL
          value: http://checkout:5011
        - name: PAYMENT_SERVICE_URL
          value: http://payment:5012
        - name: INVENTORY_SERVICE_URL
          value: http://inventory:5013
        - name: PROMOTION_SERVICE_URL
          value: http://promotion:5015
        - name: SHIPPING_SERVICE_URL
          value: http://shipping:5016
        - name: INTERACTION_SERVICE_URL
          value: http://interaction:5020
        - name: NOTIFICATION_SERVICE_URL
          value: http://notification:5021
        - name: ADMIN_AUDIT_SERVICE_URL
          value: http://admin-audit:5022
        - name: OTEL_ENABLED
          value: 'true'
        - name: OTEL_SERVICE_NAME
          value: shop_web
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://host.docker.internal:4317
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: grpc
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE),k8s.node.name=$(NODE_NAME)
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 20
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: shop-web
  namespace: recshop-example
  labels:
    app: shop_web
spec:
  type: ClusterIP
  selector:
    app: shop_web
  ports:
  - name: http
    port: 3000
    targetPort: 3000
