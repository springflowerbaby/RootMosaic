# Source template: configure namespace, images, database, assets and observability before use.
# The portable business deployment entry renders the 25 application templates.
apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-gw-confs
  namespace: recshop-example
data:
  baseline.conf: "upstream catalog_up { server catalog:5005; }\nserver {\n  listen\
    \ 80;\n  location / {\n    proxy_pass http://catalog_up;\n    proxy_read_timeout\
    \ 8s;\n    proxy_connect_timeout 8s;\n    proxy_send_timeout 8s;\n  }\n}\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-gw
  namespace: recshop-example
  labels:
    app: catalog-gw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-gw
  template:
    metadata:
      labels:
        app: catalog-gw
    spec:
      enableServiceLinks: false
      initContainers:
      - name: seed-conf
        image: nginx:alpine
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - cp /confs/baseline.conf /etc/nginx/conf.d/default.conf && chmod 444 /etc/nginx/conf.d/default.conf
        volumeMounts:
        - name: confs
          mountPath: /confs
        - name: live
          mountPath: /etc/nginx/conf.d
      containers:
      - name: nginx
        image: nginx:alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        readinessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 10
          timeoutSeconds: 3
        volumeMounts:
        - name: confs
          mountPath: /confs
        - name: live
          mountPath: /etc/nginx/conf.d
          readOnly: true
      volumes:
      - name: confs
        configMap:
          name: catalog-gw-confs
      - name: live
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-gw
  namespace: recshop-example
spec:
  selector:
    app: catalog-gw
  ports:
  - port: 80
    targetPort: 80
