# Source template: configure namespace, images, database, assets and observability before use.
# The portable business deployment entry renders the 25 application templates.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-memory
  namespace: recshop-example
  labels:
    app: ai-memory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-memory
  template:
    metadata:
      labels:
        app: ai-memory
    spec:
      enableServiceLinks: false
      containers:
      - name: ai-memory
        image: recweb-ai-memory:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 5008
        env:
        - name: NACOS_ENABLED
          value: 'false'
        - name: AI_MEMORY_SERVICE_HOST
          value: 0.0.0.0
        - name: DB_HOST
          value: mysql.example.internal
        - name: DB_PORT
          value: '3306'
        - name: DB_NAME
          value: shopify2
        - name: DB_USER
          value: recshop
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-cred
              key: password
        - name: OTEL_ENABLED
          value: 'true'
        - name: OTEL_SERVICE_NAME
          value: ai_memory_service
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://host.docker.internal:4317
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: grpc
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE),k8s.node.name=$(NODE_NAME)
        readinessProbe:
          httpGet:
            path: /health
            port: 5008
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 5008
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ai-memory
  namespace: recshop-example
  labels:
    app: ai-memory
spec:
  type: ClusterIP
  selector:
    app: ai-memory
  ports:
  - name: http
    port: 5008
    targetPort: 5008
